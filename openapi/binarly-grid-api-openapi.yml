openapi: 3.2.0
info:
  title: Binarly Grid API
  version: 4.275.2
security:
- auth: []
tags:
- name: Grid
paths:
  /api/v4/grids/products:gridList:
    post:
      summary: Grid List Products
      operationId: GridListProducts
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridProducts'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/images:gridList:
    post:
      summary: Grid List Images
      operationId: GridListImages
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridImagesQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridImages'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/scans:gridList:
    post:
      summary: Grid List Scans
      operationId: GridListScans
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridScans'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/files:gridList:
    post:
      summary: Grid List Files
      operationId: GridListFiles
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridFiles'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/findings:gridList:
    post:
      summary: Grid List Findings
      operationId: GridListFindings
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      parameters:
      - $ref: '#/components/parameters/QueryOptionalContentType'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridFindingsQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridFindings'
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/dependencies:gridList:
    post:
      summary: Grid List Dependencies
      operationId: GridListDependencies
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridDependencies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/components:gridList:
    post:
      summary: Grid List Components
      operationId: GridListComponents
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridComponents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/cryptographicAssets:gridList:
    post:
      summary: Grid List Cryptographic Assets
      operationId: GridListCryptographicAssets
      x-permission: ''
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridCryptographicAssets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/customRules:gridList:
    post:
      summary: Grid List Custom Rules
      operationId: GridListRules
      x-permission: customRules.list
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridRules'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /api/v4/grids/users:gridList:
    post:
      summary: Grid List Users
      operationId: GridListUsers
      x-permission: users.list
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridUsers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v4/grids/groups:gridList:
    post:
      summary: Grid List Groups
      operationId: GridListGroups
      x-permission: groups.list
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridGroups'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /api/v4/grids/groupMembers:gridList:
    post:
      summary: Grid List Group Members
      operationId: GridListGroupMembers
      x-permission: ''
      tags:
      - Grid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GridQuery'
      responses:
        '200':
          description: success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GridGroupMembers'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  schemas:
    WithIsEnabled:
      type: object
      required:
      - isEnabled
      properties:
        isEnabled:
          type: boolean
    ULID:
      type: string
      format: ulid
      minLength: 26
      maxLength: 26
      example: 01ARZ3NDEKTSV4RRFFQ69G5FAV
      x-go-type: ulid.ULID
      x-go-type-import:
        path: github.com/oklog/ulid/v2
    WithOptionalCreateTime:
      type: object
      properties:
        createTime:
          type: string
          readOnly: true
          example: '2024-01-01T01:00:00Z'
    WithLinkage:
      type: object
      required:
      - linkage
      properties:
        linkage:
          type: string
          enum:
          - unspecified
          - embedded
          - external
          - project
          - build
          - derived
          - vendored
          - direct
    WithOptionalConfidence:
      type: object
      properties:
        confidence:
          type: number
          format: float
    WithIsAttachment:
      type: object
      required:
      - isAttachment
      properties:
        isAttachment:
          type: boolean
          default: false
          readOnly: true
    WithScanId:
      type: object
      required:
      - scanId
      properties:
        scanId:
          allOf:
          - $ref: '#/components/schemas/ULID'
    WithIsLatest:
      type: object
      required:
      - isLatest
      properties:
        isLatest:
          type: boolean
    WithDependenciesCount:
      type: object
      required:
      - dependenciesCount
      properties:
        dependenciesCount:
          type: integer
    WithWeaponisedExploit:
      type: object
      required:
      - weaponisedExploit
      properties:
        weaponisedExploit:
          type: integer
    WithOptionalKnownFixedVersion:
      type: object
      properties:
        knownFixedVersion:
          type: string
    FindingIdentifier:
      type: object
      properties:
        brly:
          type: string
        cve:
          type: string
        ghsa:
          type: string
        gsd:
          type: string
        osv:
          type: string
    WithOptionalCryptoAlgorithmPrimitive:
      type: object
      properties:
        cryptoAlgorithmPrimitive:
          type: string
    GridFindingsQuery:
      allOf:
      - $ref: '#/components/schemas/GridQuery'
      - $ref: '#/components/schemas/WithGridFindingsFields'
    GridProducts:
      allOf:
      - $ref: '#/components/schemas/WithGridProducts'
      - $ref: '#/components/schemas/WithTotals'
    GridCryptographicAssets:
      allOf:
      - $ref: '#/components/schemas/WithGridCryptographicAssets'
      - $ref: '#/components/schemas/WithTotals'
    WithProperty:
      type: object
      required:
      - property
      properties:
        property: {}
    WithGridGroups:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GridGroup'
    ResourceType:
      type: string
      enum:
      - Org
      - Group
      - Product
      - User
      - Image
      - Finding
      - Occurrence
    WithOptionalHealthTrend:
      type: object
      properties:
        healthTrend:
          readOnly: true
          type: string
          enum:
          - noImageUploaded
          - insufficientData
          - downtrend
          - noChange
          - uptrend
    NISTIR8547BlockCipher:
      type: object
      properties:
        securityStrength:
          type: string
        securityCategory:
          type: integer
      required:
      - securityStrength
      - securityCategory
    GridDependency:
      allOf:
      - $ref: '#/components/schemas/WithId'
      - $ref: '#/components/schemas/WithScanId'
      - $ref: '#/components/schemas/WithVendor'
      - $ref: '#/components/schemas/WithProduct'
      - $ref: '#/components/schemas/WithVersion'
      - $ref: '#/components/schemas/WithLicense'
      - $ref: '#/components/schemas/WithLinkage'
      - $ref: '#/components/schemas/WithOptionalComponentsCount'
      - $ref: '#/components/schemas/WithSeveritiesAll'
      - $ref: '#/components/schemas/WithSeveritiesCritical'
      - $ref: '#/components/schemas/WithSeveritiesHigh'
      - $ref: '#/components/schemas/WithSeveritiesMedium'
      - $ref: '#/components/schemas/WithSeveritiesLow'
      - $ref: '#/components/schemas/WithSeveritiesUnspecified'
      - $ref: '#/components/schemas/WithHasKnownFix'
      - $ref: '#/components/schemas/WithFindingsWithKnownFixAll'
    NISTIR8547:
      type: object
      properties:
        algorithm:
          type: string
        parameter:
          $ref: '#/components/schemas/NISTIR8547Parameter'
        compliant:
          $ref: '#/components/schemas/NISTIR8547SecurityProfile'
        notCompliant:
          $ref: '#/components/schemas/NISTIR8547Recommendations'
    WithOptionalDuration:
      description: Duration in milliseconds
      type: object
      properties:
        duration:
          type: integer
          format: int64
          minimum: 0
    WithFilename:
      type: object
      required:
      - filename
      properties:
        filename:
          type: string
    WithOptionalComponent:
      type: object
      properties:
        component:
          $ref: '#/components/schemas/Component'
    UUID:
      type: string
      format: uuid
    GridFindings:
      allOf:
      - $ref: '#/components/schemas/WithGridFindings'
      - $ref: '#/components/schemas/WithTotals'
    WithOptionalProductIsArchived:
      type: object
      properties:
        productIsArchived:
          type: boolean
    NISTIR8547Recommendation:
      type: object
      properties:
        algorithm:
          type: string
        parameter:
          type: string
        security:
          $ref: '#/components/schemas/NISTIR8547Security'
    WithOptionalFiles:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/File'
    WithOptionalGroupRoleBindings:
      type: object
      properties:
        groupRoleBindings:
          type: array
          items:
            $ref: '#/components/schemas/RoleBinding'
    WithVendor:
      type: object
      required:
      - vendor
      properties:
        vendor:
          type: string
    WithOptionalReferences:
      type: object
      properties:
        references:
          type: array
          items:
            $ref: '#/components/schemas/FindingReference'
    WithIsVulnerable:
      type: object
      required:
      - isVulnerable
      properties:
        isVulnerable:
          type: boolean
    WithGridFindingsFields:
      type: object
      properties:
        fields:
          type: array
          items:
            type: string
            enum:
            - id
            - productId
            - productName
            - images
            - createTime
            - name
            - toolName
            - findingType
            - findingSubtype
            - identifiers
            - classifications
            - references
            - component
            - severity
            - description
            - isEstimatedEpss
            - isReachable
            - hasJiraTicket
            - findingStatus
            - componentName
            - componentId
            - displayName
            - componentNames
            - isSsvcParanoidDecision
            - hasKnownFix
            - knownFixedVersion
            - isKev
            - isKnownRansomwareUse
            - dependencyComponentsCount
            - imageId
            - scanId
            - dependencyId
            - referencedArtefactId
            - cvssLatestBaseScore
            - epssProbability
            - secret
            - ssvcDecision
            - cryptoAlgorithmName
            - cryptoAlgorithmPrimitive
            - dependency
            - isNistIR8547Compliant
            - cryptoProtocolName
            - compareLeftImageId
            - compareRightImageId
            - compareSide
            - compliance
            - exploitabilityPredicates
            - emsScore
            - confidence
            - exploitabilityCounts
    WithSeveritiesCritical:
      type: object
      required:
      - severitiesCritical
      properties:
        severitiesCritical:
          type: integer
    WithFindingTypeCounts:
      type: object
      required:
      - findingTypeCounts
      properties:
        findingTypeCounts:
          type: array
          items:
            $ref: '#/components/schemas/FindingTypeCount'
    WithOptionalAttributes:
      type: object
      properties:
        attributes: {}
    WithOptionalHasKnownFix:
      type: object
      properties:
        hasKnownFix:
          type: boolean
    WithDownloadUrl:
      type: object
      required:
      - downloadUrl
      properties:
        downloadUrl:
          type: string
          readOnly: true
    WithOptionalExploitabilityCounts:
      type: object
      properties:
        exploitabilityCounts:
          $ref: '#/components/schemas/ExploitabilityCounts'
    WithOptionalReferencedArtefactId:
      type: object
      properties:
        referencedArtefactId:
          type: string
    ForbiddenErrorResponse:
      type: object
      required:
      - message
      - permission
      - resourceName
      properties:
        message:
          type: string
        permission:
          type: string
        resourceName:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    WithOptionalFindingsBySeverity:
      type: object
      properties:
        findingsBySeverity:
          $ref: '#/components/schemas/CountBySeverity'
    NISTIR8547KeyEstablishmentSecurity:
      type: object
      properties:
        keyEstablishment:
          $ref: '#/components/schemas/NISTIR8547KeyEstablishment'
      required:
      - keyEstablishment
    WithSeveritiesMedium:
      type: object
      required:
      - severitiesMedium
      properties:
        severitiesMedium:
          type: integer
    GridComponents:
      allOf:
      - $ref: '#/components/schemas/WithGridComponents'
      - $ref: '#/components/schemas/WithTotals'
    WithComponent:
      type: object
      required:
      - component
      properties:
        component:
          $ref: '#/components/schemas/Component'
    GridFinding:
      allOf:
      - $ref: '#/components/schemas/WithId'
      - $ref: '#/components/schemas/WithOptionalProductId'
      - $ref: '#/components/schemas/WithOptionalProductName'
      - $ref: '#/components/schemas/WithOptionalImages'
      - $ref: '#/components/schemas/WithOptionalCreateTime'
      - $ref: '#/components/schemas/WithOptionalName'
      - $ref: '#/components/schemas/WithOptionalToolName'
      - $ref: '#/components/schemas/WithOptionalFindingType'
      - $ref: '#/components/schemas/WithOptionalFindingSubtype'
      - $ref: '#/components/schemas/WithOptionalIdentifiers'
      - $ref: '#/components/schemas/WithOptionalClassifications'
      - $ref: '#/components/schemas/WithOptionalReferences'
      - $ref: '#/components/schemas/WithOptionalComponent'
      - $ref: '#/components/schemas/WithOptionalSeverity'
      - $ref: '#/components/schemas/WithOptionalDescription'
      - $ref: '#/components/schemas/WithOptionalIsEstimatedEpss'
      - $ref: '#/components/schemas/WithOptionalIsReachable'
      - $ref: '#/components/schemas/WithOptionalHasJiraTicket'
      - $ref: '#/components/schemas/WithOptionalFindingStatus'
      - $ref: '#/components/schemas/WithOptionalComponentName'
      - $ref: '#/components/schemas/WithOptionalComponentId'
      - $ref: '#/components/schemas/WithOptionalDisplayName'
      - $ref: '#/components/schemas/WithOptionalComponentNames'
      - $ref: '#/components/schemas/WithOptionalIsSsvcParanoidDecision'
      - $ref: '#/components/schemas/WithOptionalHasKnownFix'
      - $ref: '#/components/schemas/WithOptionalKnownFixedVersion'
      - $ref: '#/components/schemas/WithOptionalIsKev'
      - $ref: '#/components/schemas/WithOptionalIsKnownRansomwareUse'
      - $ref: '#/components/schemas/WithOptionalDependencyComponentsCount'
      - $ref: '#/components/schemas/WithOptionalImageId'
      - $ref: '#/components/schemas/WithOptionalScanId'
      - $ref: '#/components/schemas/WithOptionalDependencyId'
      - $ref: '#/components/schemas/WithOptionalReferencedArtefactId'
      - $ref: '#/components/schemas/WithOptionalCvssLatestBaseScore'
      - $ref: '#/components/schemas/WithOptionalEpssProbability'
      - $ref: '#/components/schemas/WithOptionalSecret'
      - $ref: '#/components/schemas/WithOptionalSsvcDecision'
      - $ref: '#/components/schemas/WithOptionalCryptoAlgorithmName'
      - $ref: '#/components/schemas/WithOptionalCryptoAlgorithmPrimitive'
      - $ref: '#/components/schemas/WithOptionalDependency'
      - $ref: '#/components/schemas/WithOptionalIsNistIR8547Compliant'
      - $ref: '#/components/schemas/WithOptionalCryptoProtocolName'
      - $ref: '#/components/schemas/WithOptionalCompareLeftImageId'
      - $ref: '#/components/schemas/WithOptionalCompareRightImageId'
      - $ref: '#/components/schemas/WithOptionalCompareSide'
      - $ref: '#/components/schemas/WithOptionalCompliance'
      - $ref: '#/components/schemas/WithOptionalExploitabilityPredicates'
      - $ref: '#/components/schemas/WithOptionalEmsScore'
      - $ref: '#/components/schemas/WithOptionalConfidence'
      - $ref: '#/components/schemas/WithOptionalExploitabilityCounts'
    WithOptionalTitle:
      type: object
      properties:
        title:
          type: string
    Image:
      allOf:
      - $ref: '#/components/schemas/WithId'
      - $ref: '#/components/schemas/WithName'
      - $ref: '#/components/schemas/WithVersion'
      - $ref: '#/components/schemas/WithOptionalParent'
      - $ref: '#/components/schemas/WithCreateTime'
      - $ref: '#/components/schemas/WithAuthor'
      - $ref: '#/components/schemas/WithOptionalFiles'
      - $ref: '#/components/schemas/WithOptionalScans'
      - $ref: '#/components/schemas/WithOptionalLatestScan'
      - $ref: '#/components/schemas/WithOptionalIsArchived'
      - $ref: '#/components/schemas/WithOptionalImageCounts'
    WithOptionalIsNistIR8547Compliant:
      type: object
      properties:
        isNistIR8547Compliant:
          type: boolean
    FindingClassification:
      type: object
      properties:
        cwe:
          type: string
        attck:
          type: string
        mbc:
          type: string
    WithLicense:
      type: object
      required:
      - license
      properties:
        license:
          type: string
    WithGridRules:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/GridRule'
    WithOptionalFindingType:
      type: object
      properties:
        type:
          type: string
          enum:
          - knownVulnerability
          - unknownVulnerability
          - maliciousCode
          - suspiciousCode
          - dependencyVulnerability
          - cryptographicAsset
          - mitigation
          - weakness
          - supplyChainFailure
          - secret
          - leakedSecret
          - uncategorized
    WithOptionalSource:
      type: object
      properties:
        source:
          $ref: '#/components/schemas/ULID'
    WithOptionalLatestScanState:
      type: object
      properties:
        latestScanState:
          $ref: '#/components/schemas/ScanState'
    WithGridImages:
      type: object
      required:
      - rows
      properties:
        rows:
          type: array
