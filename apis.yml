aid: binarly
name: Binarly
description: >-
  Binarly is a firmware and software supply-chain security company whose Binarly
  Transparency Platform performs binary-native analysis of compiled software,
  firmware, and container images without requiring source code. It detects known
  and unknown vulnerabilities, hardcoded secrets, cryptographic materials,
  malicious code, and missing hardening mitigations across UEFI, bootloaders,
  Linux packages, and application binaries, then generates SBOM, VEX, CBOM, and
  PQC-compliance artifacts for supply-chain assurance. The platform exposes a
  REST API (v4, Keycloak/OIDC-authenticated) so producers can automate firmware
  scanning inside CI/CD pipelines and enterprise buyers can programmatically
  assess vendor software. Binarly also maintains open firmware-research tooling
  such as the FwHunt rule format and fwhunt-scan. The company was surfaced as a
  portfolio company of Canaan Partners.
