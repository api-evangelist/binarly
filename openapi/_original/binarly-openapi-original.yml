        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      summary: Create Scan
      operationId: CreateScan
      x-permission: images.create
      tags:
        - Scan
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/scans/{scanId}:
    get:
      summary: Get Scan by ID
      operationId: GetScan
      x-permission: products.view
      tags:
        - Scan
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - $ref: "#/components/parameters/PathScanId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/scans/{scanId}/states:
    post:
      summary: Create Scan State
      operationId: CreateScanState
      # Use the same permission as for uploading images and creating scans
      x-permission: images.create
      tags:
        - Scan
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - $ref: "#/components/parameters/PathScanId"
      requestBody:
        content:
          application/json:
