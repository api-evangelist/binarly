openapi: 3.0.3
info:
  title: Binarly API
  version: 4.275.2
paths:
  /api/v4/products:
    get:
      summary: List Products
      operationId: ListProducts
      x-permission: ""
      x-pass-resource-ids:
        resourceType: Product
        permission: products.view
      tags:
        - Product
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Products"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
    post:
      summary: Create Product
      operationId: CreateProduct
      x-permission: products.create
      tags:
        - Product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductPayload"
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products:bulkArchive:
    post:
      summary: Bulk Archive Products
      operationId: BulkArchiveProducts
      x-permission: products.archive
      x-resource-id-source: bulk-ids
      tags:
        - Product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIds"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIds"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products:bulkUnarchive:
    post:
      summary: Bulk Unarchive Products
      operationId: BulkUnarchiveProducts
      x-permission: products.archive
      x-resource-id-source: bulk-ids
      tags:
        - Product
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIds"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIds"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products/{productId}:
    get:
      summary: Get Product by ID
      operationId: GetProduct
      x-permission: products.view
      tags:
        - Product
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
    patch:
      summary: Update Product by ID
      operationId: UpdateProduct
      x-permission: products.update
      tags:
        - Product
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductPayload"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products/{productId}/tempFiles:generateUploadUrl:
    get:
      summary: Generate Temporary File Upload URL
      operationId: GenerateTempFileUploadURL
      x-permission: images.create
      tags:
        - TempFile
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TempFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images:upload:
    post:
      summary: Upload Image
      operationId: UploadImage
      x-permission: images.create
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - name: createScan
          in: query
          description: Create a Scan for the Image
          schema:
            type: boolean
            default: true
        - name: tempFileId
          in: query
          description: Temporary File ID of uploaded file
          required: false
          schema:
            $ref: "#/components/schemas/ULID"
        - name: imageName
          in: query
          description: Uploaded image name when body is empty
          required: false
          schema:
            type: string
        - name: version
          in: query
          description: Uploaded image version when body is empty
          required: false
          schema:
            type: string
        - name: filename
          in: query
          description: Uploaded image filename when body is empty
          required: false
          schema:
            type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ImageUpload"
      responses:
        "201":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}:
    get:
      summary: Get Image by ID
      operationId: GetImage
      x-permission: "products.view"
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - name: withCounts
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update Image by ID
      operationId: UpdateImage
      x-permission: images.update
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateImagePayload"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products/{productId}/images:
    get:
      summary: List Images
      operationId: ListImages
      x-permission: products.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WithImages"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images:bulkArchive:
    post:
      summary: Bulk Archive Images
      operationId: BulkArchiveImages
      x-permission: images.archive
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIds"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIds"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products/{productId}/images:bulkUnarchive:
    post:
      summary: Bulk Unarchive Images
      operationId: BulkUnarchiveImages
      x-permission: images.archive
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkIds"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkIds"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v4/products/{productId}/images/{imageId}/sbomReport:cycloneDX:
    get:
      summary: CycloneDX SBOM Report for an Image
      operationId: GetSbomReportCycloneDX
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - $ref: "#/components/parameters/QueryOptionalContentType"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbomReport"
            application/xml:
              schema:
                $ref: "#/components/schemas/SbomReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/sbomReport:SPDX:
    get:
      summary: SPDX SBOM Report for an Image
      operationId: GetSbomReportSPDX
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbomReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/cbomReport:cycloneDX:
    get:
      summary: CBOM Report for an Image
      operationId: GetCbomReport
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SbomReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/vexReport:openVEX:
    get:
      summary: VEX Report for an Image in OpenVEX format
      operationId: GetVexReportOpenVEX
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - $ref: "#/components/parameters/QueryOptionalFindingId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VEXReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/vexReport:cycloneDX:
    get:
      summary: VEX Report for an Image in CycloneDX format
      operationId: GetVexReportCycloneDX
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - $ref: "#/components/parameters/QueryOptionalFindingId"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VEXReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
  /api/v4/products/{productId}/images/{imageId}/findingsReport:pdf:
    get:
      summary: Image Findings PDF Report
      operationId: ImageFindingsReportPdf
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - name: mode
          in: query
          schema:
            type: string
            enum:
              - summary
              - full
      responses:
        "200":
          description: detail report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products/{productId}/images/{imageId}/findingsReport:download:
    post:
      summary: Download Image Report
      operationId: DownloadImageReport
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum:
              - summary
              - full
        - $ref: "#/components/parameters/QueryContentType"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GridQuery"
      responses:
        "200":
          description: detail report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/ReportImage"
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"
  /api/v4/products/{productId}/images/{imageId}/cryptographicMaterialsReport:
    get:
      summary: Download Cryptographic Materials Report
      operationId: CryptographicMaterialsReport
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - name: mode
          in: query
          required: true
          schema:
            type: string
            enum:
              - pqc-compliance
        - $ref: "#/components/parameters/QueryContentType"
      responses:
        "200":
          description: cryptographic materials report
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                $ref: "#/components/schemas/CryptographicMaterialsReportImage"
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v4/products/{productId}/images/{imageId}/advisoryReport:
    post:
      summary: Advisory Report
      operationId: AdvisoryReport
      x-pass-resource-ids:
        resourceType: Product
        permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
        - $ref: "#/components/parameters/QueryContentType"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GridQuery"
      responses:
        "200":
          description: advisory report
          content:
            text/markdown:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"

  /api/v4/products/{productId}/images/{imageId}/findingsReport:json:
    post:
      summary: Image Findings JSON Report
      operationId: ImageFindingsReportJson
      x-permission: reports.view
      tags:
        - Image
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportQuery"
      responses:
        "200":
          description: success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportImage"
          headers:
            Content-Disposition:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v4/products/{productId}/images/{imageId}/scans:
    get:
      summary: List Scans
      operationId: ListScans
      x-permission: products.view
      tags:
        - Scan
      parameters:
        - $ref: "#/components/parameters/PathProductId"
        - $ref: "#/components/parameters/PathImageId"
      responses:
        "200":
          description: success
          content:
